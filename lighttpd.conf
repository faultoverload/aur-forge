# aur-forge lighttpd.conf — serves the pacman repo + web UI on :8080.
#
# Verified config based on the research report at
# /home/hermesagent/Documents/Obsidian Vault/Research/2026-08-30-aur-forge-web-server.md
# (empirically tested against lighttpd 1.4.74 on Ubuntu aarch64; same
# mod_cgi behavior as Arch's 1.4.85-1).
#
# Server layout inside the container:
#   /repo/${REPO_NAME}.x86_64/   — the signed pacman repo
#   /repo/keys/aur-forge.pub     — symlinked from /keys/aur-forge.pub by init.sh
#   /usr/lib/aur-forge/cgi-bin/  — bash CGI scripts (index, check, add)
#   /usr/share/aur-forge/www/    — static web UI assets (install.html, style.css)
#
# URL layout (what clients see):
#   /                              → web UI (CGI: index.cgi)
#   /cgi-bin/{index,check,add}.cgi → form handlers
#   /${REPO_NAME}.x86_64/...       → pacman repo (static)
#   /keys/aur-forge.pub            → public signing key (static)
#   /install.html                  → static install instructions
#   /style.css                     → dark retro stylesheet

# ----------------------------------------------------------------------
# Modules
# ----------------------------------------------------------------------
server.modules = (
    "mod_access",
    "mod_indexfile",   # must come before mod_cgi (lighttpd warns otherwise)
    "mod_alias",
    "mod_setenv",      # expose CSRF_SECRET_FILE / PKGLIST to CGI scripts
    "mod_cgi",         # /cgi-bin/*.cgi
    "mod_rewrite",     # / -> /cgi-bin/index.cgi
    "mod_dirlisting",
    "mod_accesslog",
)

# ----------------------------------------------------------------------
# Server identity + network
# ----------------------------------------------------------------------
server.document-root = "/repo"
server.port         = 8080
server.bind         = "0.0.0.0"
server.pid-file     = "/var/run/aur-forge/lighttpd.pid"
server.errorlog     = "/var/log/aur-forge-lighttpd/error.log"
accesslog.filename  = "/var/log/aur-forge-lighttpd/access.log"

# ----------------------------------------------------------------------
# Privilege: container's runtime uid (compose `user: "999:1000"`).
# Use the NUMERIC form only. Setting server.username/server.groupname
# forces lighttpd to do getpwnam/getgrnam at startup, which fails with
# "(server.c.1804) can't find groupname lighttpd" on Arch base images
# that don't ship a lighttpd user/group by default — and the failure
# happens BEFORE the numeric uid/gid is consulted, so the service
# exits with status 1 even though the numeric IDs are valid. Drop the
# name lookups entirely; the numeric IDs are sufficient.
# ----------------------------------------------------------------------
server.uid  = 999
server.gid  = 1000

# ----------------------------------------------------------------------
# Mime + index defaults
# ----------------------------------------------------------------------
index-file.names = ( "index.html", "index.cgi" )
# Stream CGI output so a slow build doesn't buffer the whole response.
server.stream-response-body = 2
# Always advertise the right charset for HTML.
mimetype.assign = (
    ".html"   => "text/html; charset=utf-8",
    ".htm"    => "text/html; charset=utf-8",
    ".css"    => "text/css; charset=utf-8",
    ".js"     => "application/javascript; charset=utf-8",
    ".txt"    => "text/plain; charset=utf-8",
    ".pkg.tar.zst"      => "application/zstd",
    ".pkg.tar.zst.sig"  => "application/pgp-signature",
    ".db.tar.zst"       => "application/zstd",
    ".files.tar.zst"    => "application/zstd",
    ".pub"              => "application/pgp-keys",
)

# ----------------------------------------------------------------------
# URL routing
# ----------------------------------------------------------------------

# Alias static web UI assets from /usr/share/aur-forge/www/ into the
# URL space at /. install.html is the printable install-instructions
# page that doesn't require a CSRF round-trip; style.css backs both
# this static page and the CGI-rendered pages (the CGI inlines the
# same rules via cgi_html_doc so the static page is purely optional).
alias.url = (
    "/install.html" => "/usr/share/aur-forge/www/install.html",
    "/style.css"    => "/usr/share/aur-forge/www/style.css",
    "/cgi-bin/"     => "/usr/lib/aur-forge/cgi-bin/",
)

# GET / -> /cgi-bin/index.cgi. POST /cgi-bin/check.cgi and
# /cgi-bin/add.cgi are dispatched by URL match (mod_cgi handles both).
url.rewrite-once = (
    "^/$" => "/cgi-bin/index.cgi",
)

# mod_cgi configuration. The empty-string handler (`"" => ""`) means
# "use the script's shebang line to find the interpreter" — which is
# exactly what we want for bash CGI. The mod_cgi docs note this is the
# standard pattern for shell-script CGIs.
$HTTP["url"] =~ "^/cgi-bin" {
    cgi.assign = ( "" => "" )
    # Block direct read access to the .cgi file source via URL — only
    # the executable path should serve. lighttpd will 403 on GET to a
    # URL whose path doesn't match the cgi.assign pattern.
}

# ----------------------------------------------------------------------
# Hardening
# ----------------------------------------------------------------------

# Don't expose server version in error pages.
server.tag = "aur-forge"

# Disable keep-alive on the pacman repo path. pacman clients don't
# reuse TCP connections; keep-alive adds latency under contention.
$HTTP["url"] =~ "^/aur-forge\.x86_64" {
    server.max-keep-alive-requests = 0
}

# Reasonable limits for a single-operator homelab.
server.max-connections = 64
server.max-request-size = 1024   # 1 KiB cap on POST body (CSRF + small textarea)
